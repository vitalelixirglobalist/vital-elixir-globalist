<style>
    .qty-dropdown{
    position:relative;
    width:100%;
    max-width:100%;
    flex:1;
    display:block;
    margin-top:10px;
    font-size:13px;
}

    .qty-dropdown,
    .qty-selected,
    .qty-options{
        width:100%;
        box-sizing:border-box;
    }

    .qty-selected{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:8px;
    background:#fff;
    cursor:pointer;
    overflow:hidden;
}

    .qty-header,
    .qty-row{
        display:grid;
        grid-template-columns:12% 36% 24% 28%;
        align-items:center;
        gap:0;
        width:100%;
    }

    .qty-header{
        background:#f8fafc;
        padding:7px 4px;
        border-bottom:1px solid #e5e7eb;
        font-size:13px;
        font-weight:500;
    }

    .qty-header span:nth-child(1),
    .qty-header span:nth-child(2){
        font-weight:700;
        text-decoration:underline;
    }

    .qty-header span:nth-child(3),
    .qty-header span:nth-child(4){
        font-weight:500;
    }
    
    .qty-header span,
    .qty-row span{
        white-space:nowrap; 
        text-align:center;
        padding:0 2px;
        overflow:hidden;
        text-overflow:ellipsis;
    }
    .qty-header span:last-child{
    white-space:normal;
    overflow:visible;
    text-overflow:unset;
    line-height:1.15;
    text-align:center;
    word-break:keep-all;
    }

    .qty-selected-row{
        padding:8px 10px;
    }

    .qty-selected-row::after{
        content:"▾";
        float:right;
        color:#0284c7;
        font-size:11px;
    }

    .qty-options{
        display:none;
        position:absolute;
        left:0;
        right:0;
        top:100%;
        background:#fff;
        border:1px solid #d1d5db;
        border-top:none;
        z-index:100;
        box-shadow:0 8px 18px rgba(0,0,0,.08);
        max-height:250px;
        overflow-y:auto;
    }

    .qty-row{
        padding:7px 4px;
        cursor:pointer;
        transition:.2s;
        font-size:13px;
        border-top:1px solid #f1f5f9;
    }

    .qty-row:hover{
        background:#eff6ff;
    }

    .qty-row.active{
        background:#dbeafe;
        font-weight:600;
    }

    .qty-dropdown.open .qty-options{
        display:block;
    }

    .qty-title{
        font-size:12px;
        color:#64748b;
        margin-bottom:5px;
        font-weight:600;
    }

        @media(max-width:768px){
        .qty-header span:last-child{
            font-size:9px;
        }
        .qty-dropdown{
            width:100%;
            min-width:100%;
        }

        .qty-selected{
            width:100%;
        }

        .qty-options{
            width:100%;
        }

        .qty-header,
        .qty-row{
            display:grid;
            width:100%;
            grid-template-columns:minmax(34px,12%) minmax(82px,34%) minmax(52px,18%) minmax(92px,36%);
            font-size:10px;
            column-gap:0;
        }

        .qty-header{
            padding:6px 4px;
        }

        .qty-header span,
        .qty-row span{
            padding:0 1px;
        }

        .qty-selected-row{
            padding:8px 4px;
        }

      }

        function getSelectedCurrency() {

    /*
     * ============================================================
     * PRIVATE SINGLE-VARIANT QUOTE
     * ============================================================
     *
     * Used only for displaying the current selected variant
     * on the Medicines page.
     *
     * The browser sends ONLY:
     *
     *   managerKey + selectedQuantity
     *
     * Medication cost, profit calculation and box information
     * remain private on the server.
     *
     * IMPORTANT:
     * This is a single-item quotation.
     * The cart will calculate the final combined quotation again
     * when multiple medicines are selected.
     * ============================================================
     */
    async function requestSingleVariantQuote(product, variant) {

      if (!window.vitalQuoteApi) {
        throw new Error(
          'Private quotation service is unavailable.'
        );
      }

      const managerKey =
        String(
          product?.manager_key || ''
        ).trim();

      const selectedQuantity =
        Number(
          variant?.quantity
        );

      if (!/^P\d{4,}$/.test(managerKey)) {
        throw new Error(
          'Product is missing a valid Manager Key.'
        );
      }

      if (
        !Number.isInteger(selectedQuantity) ||
        selectedQuantity <= 0 ||
        selectedQuantity > 500
      ) {
        throw new Error(
          'Product has an invalid selected quantity.'
        );
      }

            return await window.vitalQuoteApi.requestQuote([
        {
          managerKey: managerKey,
          selectedQuantity: selectedQuantity
        }
      ]);

    }

    /*
     * Cache single-item quotations so changing back to a
     * previously selected quantity does not call the server again.
     */
    const singleVariantQuoteCache = new Map();

    async function getCachedSingleVariantQuote(product, variant) {

      const cacheKey =
        `${product.manager_key}:${Number(variant.quantity)}`;

      if (singleVariantQuoteCache.has(cacheKey)) {
        return singleVariantQuoteCache.get(cacheKey);
      }

      const quotePromise =
        requestSingleVariantQuote(
          product,
          variant
        );

      singleVariantQuoteCache.set(
        cacheKey,
        quotePromise
      );

      try {

        return await quotePromise;

      } catch (error) {

        singleVariantQuoteCache.delete(
          cacheKey
        );

        throw error;

      }

    }

    function formatPrivateUsdAsSelectedCurrency(amountUsd) {

      return window.pricingEngine.formatLocalAmount(
        Number(amountUsd || 0),
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );

    }

    function getPrivatePerUnitText(quote, variant) {

      const quantity =
        Number(variant?.quantity);

      const merchandiseUsd =
        Number(quote?.merchandiseUsd);

      if (
        !Number.isFinite(quantity) ||
        quantity <= 0 ||
        !Number.isFinite(merchandiseUsd)
      ) {
        return '-';
      }

      return formatPrivateUsdAsSelectedCurrency(
        merchandiseUsd / quantity
      );

    }

    function formatForeignCurrency(value) {
      return window.pricingEngine.formatLocalAmount(value, {
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      });
    }

    function formatLocalCurrency(value) {
      return window.pricingEngine.formatCurrencyAmount(value, getSelectedCurrency(), {
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      });
    }

      function getMarketPriceHeading(){

      switch(getSelectedCurrency()){
          case "USD":
              return "USA Retail Price";
          case "GBP":
              return "UK Retail Price";
          case "AUD":
              return "AUS Retail Price";
          case "EUR":
              return "EUR Retail Price";
          case "CAD":
              return "CAD Retail Price";
          case "GHS":
            return "GHS Retail Price";
          default:
              return getSelectedCurrency() + " Retail Price";
      }

  }
        /*
     * Retail/reference price may remain public.
     *
     * IMPORTANT:
     * This function NEVER supplies our selling price.
     * "Buy With Us" now comes only from the private quote API.
     */
    function getRegionalPriceData(variant){

    const currency = getSelectedCurrency();

    switch(currency){

        case "USD":
            return {
                buyWithUs: variant.price_usd,
                marketPrice: variant.market_price_usd
            };

        case "GBP":
            if(variant.price_gbp !== undefined){
                return {
                    buyWithUs: variant.price_gbp,
                    marketPrice: variant.market_price_gbp
                };
            }
            break;

        case "AUD":
            if(variant.price_aud !== undefined){
                return {
                    buyWithUs: variant.price_aud,
                    marketPrice: variant.market_price_aud
                };
            }
            break;
    }

    return {
        buyWithUs:
            window.pricingEngine.convertUsdToCurrency(
                Number(variant.price_usd || 0),
                currency
            ),

        marketPrice:
            window.pricingEngine.convertUsdToCurrency(
                Number(variant.market_price_usd || 0),
                currency
            )
    };
}


function getPerTablet(variant){

    if(!variant.quantity){
        return "-";
    }

    const regional =
        getRegionalPriceData(variant);

    return window.pricingEngine.formatCurrencyAmount(
        regional.buyWithUs / Number(variant.quantity),
        getSelectedCurrency(),
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}

          function getVariantPricing(variant){

        const currency = getSelectedCurrency();

        if(currency==="USD"){

            return window.pricingEngine.calculateItemPricing({
                price_usd: variant.price_usd,
                price_inr: variant.price_inr,
                shipping_usd: SHIPPING_USD
            },1);

        }

        if(currency==="GBP" && variant.price_gbp!==undefined){

            return window.pricingEngine.calculateItemPricing({
                price_usd: variant.price_gbp,
                price_inr: 0,
                shipping_usd: SHIPPING_USD
            },1);

        }

        if(currency==="AUD" && variant.price_aud!==undefined){

            return window.pricingEngine.calculateItemPricing({
                price_usd: variant.price_aud,
                price_inr: 0,
                shipping_usd: SHIPPING_USD
            },1);

        }

        return window.pricingEngine.calculateItemPricing({
            price_usd: variant.price_usd,
            price_inr: variant.price_inr,
            shipping_usd: SHIPPING_USD
        },1);

    }

    function buildCartItem(product, variant) {

  if (!product?.manager_key) {
    throw new Error(
      `Missing manager_key for product: ${product?.name || 'Unknown product'}`
    );
  }

  const selectedQuantity = Number(variant?.quantity);

  if (
    !Number.isInteger(selectedQuantity) ||
    selectedQuantity <= 0
  ) {
    throw new Error(
      `Invalid variant quantity for ${product.name}`
    );
  }

  // --------------------------------------------------
  // PERMANENT SERVER IDENTITY
  // --------------------------------------------------
  // managerKey + selectedQuantity uniquely identifies
  // the private VARIANTS row in the Product Manager.
  // --------------------------------------------------

  const baseItem = {

    managerKey: product.manager_key,
    productId: product.id,

    name: product.name,
    brand: product.brand,
    composition: product.composition,

    pack: variant.pack,

    selectedQuantity: selectedQuantity,

    // Legacy cart multiplier.
    // Kept temporarily while the old cart is being migrated.
    cartUnits: 1,
    quantity: 1,

    image:
      product.thumbnail ||
      product.image ||
      (Array.isArray(product.images)
        ? product.images[0]
        : ''),

    // ------------------------------------------------
    // LEGACY PRICE SNAPSHOT
    // Temporary only.
    // C.3 will stop trusting these values.
    // ------------------------------------------------

    price_usd: variant.price_usd,
    market_price_usd: variant.market_price_usd,

    price_gbp: variant.price_gbp,
    market_price_gbp: variant.market_price_gbp,

    price_aud: variant.price_aud,
    market_price_aud: variant.market_price_aud,

    price_inr: variant.price_inr,

    shipping_usd: SHIPPING_USD
  };

  const normalized =
    window.pricingEngine.normalizeCartItem(
      baseItem,
      1
    );

  return {

    ...baseItem,

    raw: normalized.raw,
    pricing: normalized.pricing,

    shipping_inr:
      normalized.raw.shipping_inr,

    final_price_usd:
      normalized.pricing.final_price_usd,

    final_price_inr:
      normalized.pricing.final_price_inr,

    final_total_usd:
      normalized.pricing.final_total_usd,

    final_total_inr:
      normalized.pricing.final_total_inr,

    final_price_local:
      normalized.pricing.final_price_local,

    final_total_local:
      normalized.pricing.final_total_local,

    selected_currency:
      normalized.pricing.selected_currency,

    total_price_usd:
      normalized.pricing.final_total_usd,

    total_price_inr:
      normalized.pricing.final_total_inr
  };
}

// --------------------------------------------------

function openProductDetails() {

        function renderQty(index){

    const variant =
        p.variants[index];

    const regional =
        getRegionalPriceData(variant);

    const header =
        card.querySelector("#marketPriceHeading");

    if(header){
        header.textContent =
            getMarketPriceHeading();
    }

    qtySelected.innerHTML = `
        <span>${variant.quantity}</span>

        <span>
            ${formatLocalCurrency(regional.buyWithUs)}
        </span>

        <span>
            ${getPerTablet(variant)}
        </span>

        <span>
            ${formatLocalCurrency(regional.marketPrice)}
        </span>
        `;

          }

        qtyOptions.innerHTML="";

               p.variants.forEach((variant,index)=>{

        const row=document.createElement("div");

        row.className="qty-row";

        /*
         * Do not expose/trust the old public selling price here.
         * The private price is requested when this quantity
         * is actually selected.
         */
              const regional =
              getRegionalPriceData(variant);

            row.innerHTML = `
              <span>${variant.quantity}</span>

              <span>
                  ${formatLocalCurrency(regional.buyWithUs)}
              </span>

              <span>
                  ${getPerTablet(variant)}
              </span>

              <span>
                  ${formatLocalCurrency(regional.marketPrice)}
              </span>
          `;
        if(index===0)
        row.classList.add("active");

        row.onclick=(e)=>{

        e.stopPropagation();

        qtyOptions
        .querySelectorAll(".qty-row")
        .forEach(r=>r.classList.remove("active"));

        row.classList.add("active");

        selectedVariantIndex=index;

        renderQty(index);

        qtyDropdown.classList.remove("open");

        };

        qtyOptions.appendChild(row);

        });


        renderQty(0);

        qtyDropdown
        .querySelector(".qty-selected")
        .onclick=(e)=>{

        e.stopPropagation();

        document
        .querySelectorAll(".qty-dropdown")
        .forEach(d=>{

        if(d!==qtyDropdown)
        d.classList.remove("open");

        });

        qtyDropdown.classList.toggle("open");

        };

        document.addEventListener("click",()=>{

        qtyDropdown.classList.remove("open");

        });


          
        addBtn.addEventListener('click', async (e) => {

          e.stopPropagation();

          const variantIndex = selectedVariantIndex;
          if (!currentUser) {
            // Not logged in
            showModal('Please log in to add items to your cart.', false);
            // Redirect to login after closing modal
            modalOk.onclick = () => {
              hideModal();
              window.location.href = 'login.html?redirect=products.html';
            };
            return;
              }
              if(!p.variants[variantIndex]){
              showModal("Please select quantity.");
              return;
          }
          // Add to local cart (for quick display)
                  const selectedVariant =
           p.variants[variantIndex];

         /*
          * Confirm that this exact selection can be resolved
          * by the private pricing server before adding it.
          *
          * We do NOT store this single-item quote as the final
          * cart price. The cart will request a fresh combined
          * quotation for all medicines.
          */
         try {

           addBtn.disabled = true;
           addBtn.textContent =
             'Checking Price...';

           await getCachedSingleVariantQuote(
             p,
             selectedVariant
           );

         } catch (error) {

           console.error(
             'Unable to validate product quotation:',
             error
           );

           showModal(
             'We could not calculate the current price for this selection. Please try again.',
             false
           );

           return;

         } finally {

           addBtn.disabled = false;
           addBtn.textContent =
             'Add to Cart';

         }

          const cartItem =
            buildCartItem(
              p,
              selectedVariant
            );

          const cart =
            JSON.parse(
              localStorage.getItem('cart')
            ) || [];
          cart.push(cartItem);
          localStorage.setItem('cart', JSON.stringify(cart));
          // Save to Firestore under user cart subcollection
          try {
            const productId =
(
  p.name +
  '-' +
  selectedVariant.pack +
  '-' +
  selectedVariant.quantity
)
.toLowerCase()
.replace(/[^a-z0-9]+/g, '-')
.replace(/(^-|-$)/g, '');

await setDoc(

  doc(
    db,
    'users',
    currentUser.uid,
    'cart',
    productId
  ),

  {

    productId,

    ...cartItem,

    dateAdded:
      new Date().toISOString()

  }

);
          } catch (error) {
            console.error('Error adding to Firestore cart:', error);
          }
          showModal(
          `${p.name}<br><strong>${selectedVariant.pack}</strong> added to cart.`,
          true
          );
        });
        productGrid.appendChild(card);
      });
    }
 function filterProducts() {
      const query = searchBar.value.toLowerCase();
      const category = categoryFilter.value;
      const filtered = allProducts.filter((p) =>
        (category === 'all' || p.category === category) &&
        (p.name.toLowerCase().includes(query) || p.brand.toLowerCase().includes(query))
      );
      displayProducts(filtered);
    }
    function applyInitialFilters() {
      const params = new URLSearchParams(window.location.search);
      const categoryParam = params.get('category');
      const searchParam = params.get('search') || params.get('q');

      if (categoryParam) {
        const decodedCategory = decodeURIComponent(categoryParam);
        const hasOption = Array.from(categoryFilter.options).some((opt) => opt.value === decodedCategory);
        categoryFilter.value = hasOption ? decodedCategory : 'all';
      }

      if (searchParam) {
        searchBar.value = decodeURIComponent(searchParam);
      }

      filterProducts();

      if ((categoryParam || searchParam) && productGrid) {
        productGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
       searchBar.addEventListener('input', filterProducts);
    categoryFilter.addEventListener('change', filterProducts);
    document.addEventListener('currency:change', filterProducts);
    loadProducts();
  </script>
  <script type="module" src="firebase-config.js"></script>
</body>
